<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <h1>Todolist App</h1>
    <p>Kelola daftar tugas kamu</p>

     <form id="todo-form">
        <input
            type="text"
            id="todo-input"
            placeholder="Masukkan todo baru..."
            required
        >
        <button type="submit">Tambah</button>
    </form>

    <!--Menampilkan pesan berhasil atau gagal.-->
    <p id="message"></p>

    <!-- tempat daftar todo ditampilkan. -->
    <ul id="todo-list"></ul>
 </div>

      <!-- menghubungkan halaman dengan REST API. -->
<script src="script.js"></script>
</body>
</html>
